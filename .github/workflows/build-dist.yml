name: Build distribution

on:
  workflow_call:
    inputs:
      verify-release:
        description: Refuse to build a development version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build distribution 📦
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pypa/build
        run: python3 -m pip install build
      - name: Build a wheel and a source distribution
        run: python3 -m build
      - name: Refuse to publish a development version
        if: inputs.verify-release
        run: |
          python3 - <<'PY'
          import glob
          import sys

          from packaging.utils import parse_wheel_filename

          wheel = glob.glob('dist/*.whl')[0].rsplit('/', 1)[-1]
          version = parse_wheel_filename(wheel)[1]
          if version.dev is not None:
              sys.exit(f'refusing to publish development version {version}')
          print(f'publishing {version}')
          PY
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
