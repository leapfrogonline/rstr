name: Build distribution

on:
  workflow_call:
    inputs:
      verify-release:
        description: Refuse to build a development version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build distribution 📦
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Build a wheel and a source distribution
        run: uv build
      - name: Refuse to publish a development version
        if: inputs.verify-release
        run: uv run --group build python .github/scripts/no_dev.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
