[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rstr"
authors = [{name = "Leapfrog Direct Response LLC", email = "oss@leapfrogdevelopment.com"}]
maintainers = [{name = "Brendan McCollam", email = "rstr@mccoll.am"}]
description = "Generate random strings in Python"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "random string",
    "reverse regex",
    "reverse regular expression",
    "testing",
    "fuzz testing",
]
urls = {Homepage = "https://github.com/leapfrogonline/rstr"}
requires-python = ">=3.11"
dynamic = ["version"]

[tool.ruff]
extend-exclude = ["build"]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "SIM",# flake8-simplify
    "I",  # isort
]

[tool.tox]
requires = ["tox>=4", "tox-uv>=1"]
env_list = [
    "pypy311",
    "pypy312",
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "py316",
    "linting",
    "typing",
]

[tool.tox.env_run_base]
package = "skip"
commands = [["python", "-m", "unittest", { replace = "posargs", extend = true }]]

[tool.tox.env.linting]
deps = ["ruff>=0.9.6", "validate-pyproject[all]"]
commands = [
    ["ruff", "format", "--check"],
    ["ruff", "check"],
    ["validate-pyproject", "pyproject.toml"],
]

[tool.tox.env.typing]
deps = ["mypy>=1.6.0,<2"]
commands = [["mypy", "--strict", { replace = "posargs", default = ["rstr"], extend = true }]]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rstr", "rstr.*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
