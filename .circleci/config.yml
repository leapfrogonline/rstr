version: 2.1

jobs:
    test:
        docker:
            - image: cimg/python:3.13
        steps:
            - checkout
            - run:
                name: Run tox
                # cimg/python bundles uv; tox-uv provides the other
                # interpreters, including the Python 3.16 pre-release
                command: uvx --with tox-uv tox

workflows:
    test:
        jobs:
            - test
